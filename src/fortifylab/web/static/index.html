<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fortify Lab Console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>Fortify Lab Console</h1>
        <p>Remote LAN operator view</p>
      </div>
      <span id="connection-state" class="status">Connecting</span>
    </header>
    <section class="grid">
      <article data-panel="deployment">
        <h2>Deployment</h2>
        <div data-content="deployment" class="loading">Loading deployment status...</div>
      </article>
      <article data-panel="configuration">
        <h2>Configuration</h2>
        <div data-content="configuration" class="loading">Loading configuration summary...</div>
      </article>
      <article data-panel="routes">
        <h2>Routes</h2>
        <div data-content="routes" class="loading">Loading route checks...</div>
      </article>
      <article data-panel="certificates">
        <h2>Certificates</h2>
        <div data-content="certificates" class="loading">Loading certificate summary...</div>
      </article>
    </section>
  </main>
  <script src="main.js"></script>
</body>
</html>
