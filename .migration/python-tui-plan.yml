      - bin/fortifylab
      - start_wizard.sh
      - requirements-python.txt
      - .migration/python-tui-plan.yml
      - docs/development/python-tui-migration.md
    current_task: Implement target Python package layout and entrypoint transition for M1.
    result: M1 skeleton merged into migration/python-tui via PR #451.
    changed:
      - Root-level fortifylab package skeleton added.
      - ./bin/fortifylab now imports from the new package instead of src/.
      - start_wizard.sh converted to a compatibility shim.
      - TUI smoke-test contract coordinated with tests.
    blockers: []
    risks:
