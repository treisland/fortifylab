    status: complete
    branch: agent/navigation-M2-menu-model
    owns:
      - fortifylab/navigation/
      - tests/test_m2_navigation_model.py
      - docs/development/python-tui-migration.md
      - .migration/python-tui-plan.yml
    current_task: Completed deterministic Python menu model for the documented Bash wizard baseline.
    result: Navigation Model PR #454 merged into migration/python-tui.
    blockers: []
    last_heartbeat: 2026-08-25
  tui:
    owner: tui-agent
    status: complete
    branch: agent/tui-M2-keybindings
    owns:
      - fortifylab/tui/
      - fortifylab/navigation/
      - tests/
    current_task: Completed Textual shell and keybindings against the M2 menu model.
    result: TUI Keybindings PR #455 merged into migration/python-tui.
    changed:
      - Pure controller API exists in fortifylab.navigation.controller.
      - Arrow, jump-to-number, Enter activation, back, help, quit, disabled, and multi-digit key paths are covered.
      - TUI shell renders the shared navigation model and avoids real operation wiring in M2.
    blockers: []
    last_heartbeat: 2026-08-25
  operations:
    owner: operations-agent
    status: complete
    branch: agent/operations-M3-adapter-catalog
    owns:
      - fortifylab/operations/
      - tests/test_m3_operation_adapters.py
      - .migration/python-tui-plan.yml
      - docs/development/python-tui-migration.md
    current_task: Completed M3 Bash lifecycle operation catalog and safe runner.
    result: Operations Adapter PR #458 merged into migration/python-tui.
    changed:
      - Added typed operation, command plan, preview, command result, and operation result models.
      - Added catalog entries for core component, sample app, and all-lab lifecycle scripts.
      - Added dry-run previews, confirmation-required metadata, and a redacting execution wrapper.
      - Added harmless command tests that do not invoke Kubernetes, Helm, Docker, or real lifecycle scripts.
    blockers: []
    risks:
      - Selected-profile lifecycle execution still depends on future guided workflow state wiring.
      - M3 runner captures command output; future TUI work may stream incrementally instead.
    last_heartbeat: 2026-08-25
  config:
    owner: config-agent
    status: complete
    branch: agent/config-M4-schema-design
    owns:
      - fortifylab/config/
      - tests/
      - .migration/python-tui-plan.yml
      - docs/development/python-tui-migration.md
    current_task: Completed read-only M4 .env schema and parser/writer contracts without replacing Bash behavior.
    result: M4 Config Schema Design PR #457 merged into migration/python-tui.
    changed:
      - Audited active Bash .env bootstrap, editor, validation, repair, backup, and rollback behavior.
      - Identified deprecated src/fortifylab/config bridge as reference-only code to remove or replace intentionally in M7.
      - Added root fortifylab.config read-only schema metadata and parser/writer capability contract.
    blockers: []
    risks:
