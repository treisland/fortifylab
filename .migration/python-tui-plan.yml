milestones:
  - id: M0
    name: Migration branch and project controls
    status: complete
    acceptance:
      - migration/python-tui exists from current dev.
      - Branch and PR rules are documented.
      - Machine-readable tracker exists.
      - Human-readable migration document exists.
      - Heartbeat ritual is documented.
      - Initial risks and blockers are captured.
  - id: M1
    name: Python app skeleton and entrypoints
    status: complete
    acceptance:
      - Primary Python package skeleton exists.
      - ./bin/fortifylab --help works from a clone.
      - ./bin/fortifylab tui launches a placeholder TUI shell.
      - start_wizard.sh is either a deliberate shim or intentionally removed.
      - Entrypoint tests pass.
    completed_at: 2026-08-25
    pull_requests:
      - 451
      - 450
    evidence:
      - ./bin/fortifylab --help passed during Architecture review.
      - ./bin/fortifylab tui --smoke-test passed during Architecture review.
      - ./bin/fortifylab tui --check passed during Architecture and Test review.
      - python3 -m compileall -q fortifylab passed during Architecture and Test review.
      - python3 -m unittest tests.test_m1_entrypoints -v passed.
      - python3 -m unittest discover -s tests -v passed with 81 tests.
      - ./scripts/validate-docs.sh passed documentation quality gates in CI.
  - id: M2
    name: Navigation parity
    status: in_progress
    acceptance:
      - Python menu tree mirrors the current Bash wizard structure.
      - Arrow-key selection works.
      - Jump-to-number selection works.
      - Return, escape, help, and quit behavior are implemented.
      - Menu parity tests cover labels and ordering.
  - id: M3
    name: Operation adapters
    status: pending
    acceptance:
      - Existing Bash lifecycle scripts are represented in an operation catalog.
      - Mutating operations show dry-run previews and require confirmation.
      - Output streams into the TUI/log layer.
      - Exit codes and failures are surfaced clearly.
      - Secrets are redacted in logs.
  - id: M4
    name: Python-native config editor
    status: pending
    acceptance:
      - .env parser preserves comments and ordering where practical.
      - Config updates create backups.
      - Diffs and secret redaction work.
      - Validation and derived URL repair are Python-native.
      - Bash config bridge is removed or no longer required.
  - id: M5
    name: Status and diagnostics
    status: pending
    acceptance:
      - Prerequisite, license, cluster, pod, registry, and TLS checks are available.
      - doctor command works without the Bash wizard.
      - Sanitized diagnostics bundle behavior is covered by tests.
  - id: M6
    name: Runbooks and help
    status: pending
    acceptance:
      - Runbook discovery and metadata validation are Python-native.
      - Help Center topics are reachable from the TUI.
      - Requirement checks and run previews work.
  - id: M7
    name: Bash wizard retirement
    status: pending
    acceptance:
      - start_wizard.sh no longer contains the application wizard.
      - Deprecated src preview references are removed or intentionally migrated.
      - Docs and tests reflect the Python TUI as the supported path.
      - Bash remains only for low-level adapters that are still intentionally retained.
  - id: M8
    name: Merge back to dev
    status: pending
    acceptance:
      - All milestone acceptance tests pass.
      - Migration tracker is complete.
      - Maintainer docs explain the final architecture.
      - migration/python-tui is ready for integration into dev.
