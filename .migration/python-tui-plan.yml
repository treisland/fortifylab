program: fortifylab-python-tui-migration
branch: migration/python-tui
base_branch: dev
current_milestone: M4
overall_status: active

goal:
  primary_objective: >-
    Replace FortifyLab's current Bash wizard with a maintainable Python CLI/TUI
    application while preserving the existing navigation structure and lab
    operation behavior.
  preserve:
    - CLI-first application direction
    - Existing wizard navigation structure
    - Safe lab deployment and lifecycle behavior
    - Proven Bash deployment scripts as temporary operation adapters
  improve:
    - Maintainability for future repo owners
    - Testability of navigation, config, operations, and status flows
    - Arrow-key selection and jump-to-number menu navigation
    - Explicit module boundaries and typed application state
    - Config safety, diagnostics, logging, and contributor onboarding
  out_of_scope:
    - Building a web UI
    - Preserving deprecated Python preview code as-is
    - Rewriting every Helm or Kubernetes command in the first milestones
    - Changing FortifyLab's lab/training purpose

heartbeat:
  cadence: daily
  stale_after_days: 3
  last_updated: 2026-08-25
  milestone: M4
  workstream: test-M4-config-engine
  branch: agent/test-M4-config-engine
  status: active
  changed:
    - M4 config engine contract tests started on a focused branch.
    - Tests cover parser fixtures, writer preservation, backup/rollback, diff redaction, validation, and derived URL repair.
    - Tests use only in-memory documents and temp files, with no live .env, Kubernetes, Helm, Docker, network, or lab-state access.
    - Engine-dependent tests skip until the implementation API lands.
  next:
    - Open PR against migration/python-tui.
    - Watch CI and coordinate with the Config Implementation branch.
    - Remove skips naturally once agent/config-M4-engine exposes the expected API.
    - Start Config CLI/TUI Bridge after the engine contract is visible.
    - Start Docs M4 config surface after implementation shape settles.
  blockers: []
  risks:
    - API names must stay coordinated with the implementation agent to avoid stale contract skips.

  needs_decision: []


open_decisions:
  - id: tui-framework
    status: accepted
    recommendation: Textual
    decision_needed_by: M1
    notes: >-
      Textual is accepted for the long-term TUI because it supports richer
      screens, keybindings, status panes, logs, and future interactive workflows.
  - id: branch-upstream
    status: accepted
    recommendation: Push migration/python-tui and set upstream to origin/migration/python-tui.
    decision_needed_by: M0
    notes: >-
      The local branch was created from origin/dev and initially tracks origin/dev.
      After first push, the upstream should be the migration integration branch.

branch_rules:
  integration_branch: migration/python-tui
  base_branch: dev
  focused_branch_pattern: agent/<workstream>-<milestone>-<short-topic>
  pr_target: migration/python-tui
  merge_back_to_dev_after: M8
  rules:
    - All migration implementation PRs target migration/python-tui.
    - Keep workstreams narrow and file ownership explicit.
    - Every PR updates this tracker when status, scope, risks, or blockers change.
    - Every milestone requires acceptance criteria and relevant tests before advancing.
    - Do not redesign navigation during M1/M2; preserve current structure first.

workstreams:
  pm:
    owner: pm-agent
    status: active
    branch: agent/pm-M3-closeout-open-M4
    owns:
      - .migration/python-tui-plan.yml
      - docs/development/python-tui-migration.md
    current_task: Close M3 and open M4 coordination.
    next_task: Spawn Config Implementation and M4 Test agents, then coordinate bridge/docs work.
    blockers: []
  architecture:
    owner: architecture-agent
    status: complete
    branch: agent/architecture-M1-skeleton
    owns:
      - fortifylab/
      - bin/fortifylab
      - start_wizard.sh
      - requirements-python.txt
      - .migration/python-tui-plan.yml
      - docs/development/python-tui-migration.md
    current_task: Implement target Python package layout and entrypoint transition for M1.
    result: M1 skeleton merged into migration/python-tui via PR #451.
    changed:
      - Root-level fortifylab package skeleton added.
      - ./bin/fortifylab now imports from the new package instead of src/.
      - start_wizard.sh converted to a compatibility shim.
      - TUI smoke-test contract coordinated with tests.
    blockers: []
    risks:
      - Legacy start_wizard.sh subcommands are not implemented in M1.
      - Deprecated src/ preview code remains until cleanup is handled by later milestones.
    last_heartbeat: 2026-08-25
  navigation:
