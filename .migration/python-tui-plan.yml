program: fortifylab-python-tui-migration
branch: migration/python-tui
base_branch: dev
current_milestone: M7
overall_status: active

goal:
  primary_objective: >-
    Replace FortifyLab's current Bash wizard with a maintainable Python CLI/TUI
    application while preserving the existing navigation structure and lab
    operation behavior.
  preserve:
    - CLI-first application direction
    - Existing wizard navigation structure
    - Safe lab deployment and lifecycle behavior
    - Proven Bash deployment scripts as temporary operation adapters
  improve:
    - Maintainability for future repo owners
    - Testability of navigation, config, operations, and status flows
    - Arrow-key selection and jump-to-number menu navigation
    - Explicit module boundaries and typed application state
    - Config safety, diagnostics, logging, and contributor onboarding
  out_of_scope:
    - Building a web UI
    - Preserving deprecated Python preview code as-is
    - Rewriting every Helm or Kubernetes command in the first milestones
    - Changing FortifyLab's lab/training purpose

heartbeat:
  cadence: daily
  stale_after_days: 3
  last_updated: 2026-08-25
  milestone: M7
  workstream: src-M7-retirement
  branch: agent/src-M7-retirement
  status: active
  changed:
    - Bash adapter boundary PR #473 landed before source cleanup integration.
    - Removed deprecated src/fortifylab preview package after supported M1-M7 entrypoints resolved through the root fortifylab/ package.
    - Removed tests/quarantine/python_preview after active M1-M7 tests covered retained CLI, config, diagnostics, operations, navigation, runbook, and compatibility contracts.
    - Replaced active src/fortifylab references in contributor and modular Bash architecture docs with root package guidance.
    - Updated M7 retirement coverage to assert deprecated preview artifacts and retired scripts/wizard internals stay removed.
  next:
    - Merge this cleanup PR against migration/python-tui.
    - Start focused M7 docs migration for supported Python architecture and remaining stale legacy command references.
  blockers: []
  risks:
    - Do not remove Bash lifecycle scripts still used by the M3 operation catalog.
    - Keep start_wizard.sh as a minimal compatibility shim unless docs and tests explicitly retire it.
    - Default tests must remain clone-safe and avoid live Kubernetes, Helm, Docker, or network dependencies.

  needs_decision:
    - Confirm whether start_wizard.sh doctor/status/help topic aliases are long-term compatibility or migration-only affordances.


open_decisions:
  - id: tui-framework
    status: accepted
    recommendation: Textual
    decision_needed_by: M1
    notes: >-
      Textual is accepted for the long-term TUI because it supports richer
      screens, keybindings, status panes, logs, and future interactive workflows.
  - id: branch-upstream
    status: accepted
    recommendation: Push migration/python-tui and set upstream to origin/migration/python-tui.
    decision_needed_by: M0
    notes: >-
      The local branch was created from origin/dev and initially tracks origin/dev.
      After first push, the upstream should be the migration integration branch.

branch_rules:
  integration_branch: migration/python-tui
  base_branch: dev
  focused_branch_pattern: agent/<workstream>-<milestone>-<short-topic>
  pr_target: migration/python-tui
  merge_back_to_dev_after: M8
  rules:
    - All migration implementation PRs target migration/python-tui.
    - Keep workstreams narrow and file ownership explicit.
    - Every PR updates this tracker when status, scope, risks, or blockers change.
    - Every milestone requires acceptance criteria and relevant tests before advancing.
    - Do not redesign navigation during M1/M2; preserve current structure first.

