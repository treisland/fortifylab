api:
  resources: null

globalService:
  resources: null

utilityService:
  resources: null

  datastore:
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"


twofactorauth:
  resources: null

fortifyConnectServer:
  resources: null

upgradejob:
  resources: null
  # The vendor configureEnvironment tool generates scanner start artifacts
  # under /usr/lib64/dotnet. Run the upgrade job container as root so the
  # generated dast-*-start archives can be written during migrations.
  containerSecurityContext:
    runAsUser: 0
  prepJob:
    resources: null

