apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lim-ingress
  namespace: fortify
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS

spec:
  ingressClassName: public
  tls:
  - hosts:
    - ${LIM}
    secretName: tls

  rules:
  - host: ${LIM}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lim
            port:
              number: 37562