apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-dvwa
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: sample-dvwa
    app.kubernetes.io/part-of: fortifylab-samples
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-dvwa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-dvwa
        app.kubernetes.io/part-of: fortifylab-samples
    spec:
      containers:
      - name: dvwa
        image: ${FORTIFY_SAMPLE_DVWA_IMAGE}
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sample-dvwa
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: sample-dvwa
    app.kubernetes.io/part-of: fortifylab-samples
spec:
  selector:
    app.kubernetes.io/name: sample-dvwa
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-dvwa
  namespace: ${NAMESPACE}
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: public
  tls:
  - hosts:
    - ${DVWA}
    secretName: tls
  rules:
  - host: ${DVWA}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sample-dvwa
            port:
              number: 80
