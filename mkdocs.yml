site_name: Fortify Lab
site_description: Lab and learning documentation for the Fortify deployment toolkit
site_url: https://treisland.github.io/fortifylab/
repo_name: treisland/fortifylab
repo_url: https://github.com/treisland/fortifylab
edit_uri: edit/dev/docs/
copyright: "Lab/demo use only — never use production credentials, source code, customer data, or scan results."

docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  **/.env
  **/.env.*
  **/generated/**
  **/input/**
  **/*.key
  **/*.pem
  **/*.p12
  **/*.pfx
  **/*.jks
  **/*.license

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/opentext.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Overview: getting-started/index.md
  - Fortify system:
      - Knowledge Center: fortify/index.md
      - Architecture and workflows: fortify/architecture-and-flows.md
      - Software Security Center (SSC): fortify/ssc.md
      - ScanCentral SAST: fortify/scancentral-sast.md
      - ScanCentral DAST: fortify/scancentral-dast.md
      - License and Infrastructure Manager (LIM): fortify/lim.md
      - MySQL: fortify/mysql.md
      - PostgreSQL: fortify/postgresql.md
      - Kubernetes Dashboard: fortify/kubernetes-dashboard.md
      - Offline Help Center: help/README.md
  - Deployment:
      - Overview: deployment/index.md
      - Deployment and lifecycle: operations/deployment-and-lifecycle.md
      - Coordinated multi-node lab: operations/coordinated-multi-node.md
      - Networking and TLS: operations/networking-and-tls.md
  - Operations:
      - Overview: operations/README.md
      - Backup and recovery: operations/backup-and-recovery.md
      - Versions and compatibility: operations/versions-and-compatibility.md
      - FCLI readiness: operations/fcli-readiness.md
      - First scan: operations/first-scan.md
      - First-scan command examples: examples/first-scan/README.md
      - Runbook Library: operations/runbooks.md
      - FCLI runbooks: runbooks/fcli.md
  - Configuration:
      - Overview: configuration/index.md
      - Secrets and licenses: operations/secrets-and-licenses.md
  - Troubleshooting:
      - Overview: troubleshooting/index.md
      - Troubleshooting by symptom: operations/troubleshooting.md
      - Sanitized diagnostics: operations/diagnostics.md
  - Safety:
      - Overview: safety/index.md
      - Lab use boundary: lab-use.md
  - Contributing:
      - Overview: contributing/index.md
      - Modular Bash architecture: development/modular-bash-architecture.md
      - Phase 3 Python migration: development/phase-3-python-migration.md
      - Python TUI migration: development/python-tui-migration.md
      - Publishing: contributing/publishing.md
  - Architecture decisions:
      - Overview: adr/README.md
      - "ADR 0001: MkDocs documentation architecture": adr/0001-mkdocs-authoritative-documentation.md
      - "ADR 0002: Python runtime migration": adr/0002-python-runtime-migration.md
